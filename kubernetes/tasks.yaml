apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks
  namespace: teampulse
  labels:
    app.kubernetes.io/name: teampulse
    app.kubernetes.io/component: tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: teampulse
      app.kubernetes.io/component: tasks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teampulse
        app.kubernetes.io/component: tasks
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tasks
          image: docker.io/sagaraug04/teampulse-tasks:1.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: teampulse-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tasks
  namespace: teampulse
spec:
  selector:
    app.kubernetes.io/name: teampulse
    app.kubernetes.io/component: tasks
  ports:
    - name: http
      port: 3001
      targetPort: http
