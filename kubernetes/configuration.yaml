apiVersion: v1
kind: ConfigMap
metadata:
  name: teampulse-config
  namespace: teampulse
data:
  TASK_API_URL: http://tasks:3001
  INSIGHTS_API_URL: http://insights:3002
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
# Replace this demonstration value before using the project outside a local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: teampulse
type: Opaque
stringData:
  password: change-this-demo-password
