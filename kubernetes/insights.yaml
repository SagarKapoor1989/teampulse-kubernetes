apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights
  namespace: teampulse
  labels:
    app.kubernetes.io/name: teampulse
    app.kubernetes.io/component: insights
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: teampulse
      app.kubernetes.io/component: insights
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teampulse
        app.kubernetes.io/component: insights
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: insights
          image: docker.io/sagaraug04/teampulse-insights:1.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: teampulse-config
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: insights
  namespace: teampulse
spec:
  selector:
    app.kubernetes.io/name: teampulse
    app.kubernetes.io/component: insights
  ports:
    - name: http
      port: 3002
      targetPort: http
